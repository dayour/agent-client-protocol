[workspace]
default-members = [
    "agent-client-protocol-schema",
    "agent-client-protocol-rt",
    "examples",
    "schema/v1",
    "schema/v2",
    "schema-generator",
]
members = [
    "agent-client-protocol-schema",
    "agent-client-protocol-rt",
    "examples",
    "schema/v1",
    "schema/v2",
    "schema-generator",
]
resolver = "3"

[workspace.dependencies]
# Intentional external runtime boundary pin; do not consume in-tree until the
# published `agent-client-protocol` 2.0.0 stops pinning
# `agent-client-protocol-schema = "=1.5.0"` while this workspace is at 1.6.0,
# or we will resolve duplicate schema types. See `docs/rfds/rust-runtime-boundary.mdx`.
agent-client-protocol = "2.0.0"
agent-client-protocol-schema = { path = "agent-client-protocol-schema", version = "1.6.0" }

# In-repo async runtime dependencies. `tokio` provides the async I/O, task,
# and process primitives the runtime crate and reference binaries build on;
# `async-trait` lets the public `Agent`/`Client` traits expose `async fn`
# without tripping the `async_fn_in_trait` lint under `-D warnings`.
tokio = { version = "1", default-features = false }
async-trait = "0.1"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let-underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
cargo = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
pedantic = "warn"
