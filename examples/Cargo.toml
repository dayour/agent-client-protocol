[package]
name = "acp-examples"
authors = ["DarbotLM maintainers"]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference agent and client binaries demonstrating the in-repo Agent Client Protocol runtime"
repository = "https://github.com/DarbotLM/agent-client-protocol"
homepage = "https://github.com/DarbotLM/agent-client-protocol"
documentation = "https://github.com/DarbotLM/agent-client-protocol/tree/main/docs"
keywords = ["agent", "client", "protocol", "example", "jsonrpc"]
categories = ["development-tools", "command-line-utilities"]
readme = "../README.md"
rust-version = "1.88.0"
publish = false

[lints]
workspace = true

[[bin]]
name = "acp-agent"
path = "src/bin/acp-agent.rs"

[[bin]]
name = "acp-client"
path = "src/bin/acp-client.rs"

[dependencies]
agent-client-protocol-rt = { path = "../agent-client-protocol-rt" }
agent-client-protocol-schema = { workspace = true }
async-trait = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "process",
    "time",
] }
