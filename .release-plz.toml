[workspace]
git_release_type = "auto"
release_always = false

[[package]]
name = "agent-client-protocol-schema"
changelog_path = "CHANGELOG.md"
git_release_latest = false
git_release_name = "Rust Crate v{{ version }}"
git_tag_name = "v{{ version }}"

[[package]]
# These two crates carry only a version-marker `src/lib.rs` plus the committed
# JSON Schema files; they export no Rust API, so cargo-semver-checks has nothing
# to inspect and `semver_check` is disabled. The wire format itself is NOT left
# unguarded: `agent-client-protocol-schema/tests/schema_wire_compat.rs` snapshots
# the v1 and v2 JSON surfaces as golden fixtures and fails on any breaking
# change (removed field, renamed variant, retyped field, new required field).
# That structural test is the compensating control for the missing semver gate.
name = "agent-client-protocol-json-schema-v1"
git_only = true
git_release_name = "Schema v{{ version }}"
git_tag_name = "schema-v{{ version }}"
publish = false
semver_check = false

[[package]]
# See the note on the v1 schema crate above: no Rust API to semver-check; wire
# compatibility is enforced by the schema_wire_compat golden tests instead.
name = "agent-client-protocol-json-schema-v2"
git_only = true
git_release_latest = false
git_release_name = "Schema v{{ version }}"
git_tag_name = "schema-v{{ version }}"
publish = false
semver_check = false

[[package]]
name = "schema-generator"
publish = false
release = false

[[package]]
# In-repo runtime and the v1/v2 bridge built on it. Both are deliberately
# unpublished: `docs/rfds/rust-runtime-boundary.mdx` keeps this repository
# schema-first and treats the external `agent-client-protocol` crate as the
# Rust runtime boundary. They exist so the protocol has an executable proof
# surface in-tree (see the `reference-launch` CI job), not as shipping
# artifacts. `release = false` also keeps release-plz from tagging and
# version-bumping crates that have no consumers outside this repository.
name = "agent-client-protocol-rt"
publish = false
release = false

[[package]]
name = "agent-client-protocol-bridge"
publish = false
release = false
