name: Upload Schema
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fork-publish-disabled:
    if: ${{ github.repository != 'agentclientprotocol/agent-client-protocol' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain fork release asset posture
        run: |
          echo "Schema release uploads are disabled in forks."
          echo "This fork tracks upstream ACP protocol content but is independently maintained for hardening work."
          echo "Do not publish release assets under upstream names from ${GITHUB_REPOSITORY}."

  upload-schema:
    permissions:
      contents: write # to upload release assets
    if: ${{ github.repository == 'agentclientprotocol/agent-client-protocol' && (startsWith(github.event.release.tag_name, 'schema-v1') || startsWith(github.event.release.tag_name, 'schema-v2')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Upload v1 schema files to release
        if: startsWith(github.event.release.tag_name, 'schema-v1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" schema/v1/*.json

      - name: Upload v2 schema files to release
        if: startsWith(github.event.release.tag_name, 'schema-v2')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" schema/v2/*.json
