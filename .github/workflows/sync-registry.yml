name: Sync Registry Docs

on:
  # Allow manual trigger
  workflow_dispatch:

  # Run hourly to pick up registry changes
  schedule:
    - cron: "15 * * * *" # Every hour at :15

jobs:
  sync:
    name: Sync Registry Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check workflow prerequisites
        id: prereqs
        env:
          RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
          RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch enabled."
            exit 0
          fi
          if [ "${{ github.repository_owner }}" != "agentclientprotocol" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping registry sync outside the upstream repository owner."
            exit 0
          fi
          if [ -z "$RELEASE_PLZ_APP_ID" ] || [ -z "$RELEASE_PLZ_APP_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping registry sync because GitHub App secrets are not configured."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.prereqs.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.prereqs.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        if: steps.prereqs.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: latest
          cache: "npm"

      - name: Install dependencies
        if: steps.prereqs.outputs.enabled == 'true'
        run: npm ci

      - name: Generate registry docs
        if: steps.prereqs.outputs.enabled == 'true'
        run: python scripts/generate_registry_docs.py

      - name: Format generated files
        if: steps.prereqs.outputs.enabled == 'true'
        run: npx prettier --write docs/get-started/registry.mdx

      - name: Check for changes
        id: changes
        if: steps.prereqs.outputs.enabled == 'true'
        run: |
          if git diff --quiet docs/get-started/registry.mdx; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

        # Generating a GitHub token, so that PRs and tags created by
        # the action can trigger actions workflows.
      - name: Generate GitHub token
        if: steps.prereqs.outputs.enabled == 'true' && steps.changes.outputs.changed == 'true' && secrets.RELEASE_PLZ_APP_ID != '' && secrets.RELEASE_PLZ_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          # GitHub App ID secret name
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          # GitHub App private key secret name
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        if: steps.prereqs.outputs.enabled == 'true' && steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v6
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}
          commit-message: "docs: update registry agents"
          title: "docs: update registry agents"
          body: |
            This PR updates the registry documentation with the latest agents from the ACP Registry CDN.

            Auto-generated by the sync-registry workflow.
          branch: auto/sync-registry
          delete-branch: true
          labels: documentation
