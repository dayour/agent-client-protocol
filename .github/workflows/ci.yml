name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' agent-client-protocol-schema/Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check with MSRV
        run: cargo check --all-targets --all-features --locked

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  generated-artifacts:
    name: Generated artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Check generated files are up to date
        run: |
          npm run generate
          if ! git diff --quiet; then
            git --no-pager diff --stat
            echo "Generated files are out of date. Run 'npm run generate' and commit the changes."
            exit 1
          fi

  conformance:
    name: Conformance suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: conformance/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix conformance

      # The positive suite asserts the reference agent conforms. The negative
      # suite asserts the harness actually detects non-conformance, including
      # malformed messages sent after a turn completes. Without the negative
      # run, a harness that passes everything would look healthy.
      - name: Run conformance suite
        run: npm run test:conformance

      - name: Run negative conformance suite
        run: npm run test:conformance:negative

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Check for typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14
        with:
          config: ./typos.toml

  npm-check:
    name: npm check script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: clippy

      - name: Install typos-cli
        run: cargo install typos-cli --version 1.48.0 --locked

      - name: Install dependencies
        run: npm ci

      - name: Run npm check
        run: npm run check

  docs-rs:
    name: docs.rs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly,stable

      - name: Check docs.rs build
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo +nightly doc -p agent-client-protocol-schema --all-features --no-deps

  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate docs site
        working-directory: docs
        run: npx mint validate

  registry-docs:
    name: Registry docs generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.14"

      - name: Smoke test registry generator offline
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "generate_registry_docs",
              "scripts/generate_registry_docs.py",
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          temp_dir = Path(os.environ["RUNNER_TEMP"]) / "registry-docs-smoke"
          temp_dir.mkdir(parents=True, exist_ok=True)
          template_path = temp_dir / "_registry_agents.mdx"
          output_path = temp_dir / "registry.mdx"
          template_path.write_text("before\n$$AGENTS_CARDS$$\nafter\n", encoding="utf-8")

          registry = {
              "agents": [
                  {
                      "id": "delta-agent",
                      "name": "Delta Agent",
                      "description": "Handles Δ safely",
                      "version": "1.0.0",
                      "repository": "https://example.com/delta-agent",
                  }
              ]
          }
          svg = '<svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M0 0h20v20H0z" /></svg>'

          def fake_request(url: str, timeout: int = 30) -> bytes:
              if url == module.REGISTRY_URL:
                  return json.dumps(registry).encode("utf-8")
              if url == f"{module.ICON_BASE_URL}/delta-agent.svg":
                  return svg.encode("utf-8")
              raise AssertionError(f"unexpected URL: {url}")

          module.TEMPLATE_PATH = template_path
          module.OUTPUT_PATH = output_path
          module._make_request = fake_request
          module.main()

          rendered = output_path.read_text(encoding="utf-8")
          assert "Delta Agent" in rendered
          assert "Handles Δ safely" in rendered
          assert "fillRule" in rendered
          assert module.PLACEHOLDER not in rendered
          print(f"Generated {output_path}")
          PY

      - name: Use Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check registry docs are up to date
        if: github.event_name != 'pull_request'
        run: |
          npm run generate:registry
          if ! git diff --quiet -- docs/get-started/registry.mdx; then
            git --no-pager diff --stat -- docs/get-started/registry.mdx
            echo "Registry documentation is out of date. Run 'npm run generate:registry' and commit the changes."
            exit 1
          fi

  rust-changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.rust-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Rust file changes
        id: rust-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  feature-powerset:
    name: Feature powerset (${{ matrix.partition }})
    needs: rust-changes
    if: needs.rust-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable

      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.45 --locked

      - name: Check feature powerset
        # `unstable` is an aggregate alias for the individual unstable_* features,
        # so excluding it avoids duplicate combinations. Limit the powerset to
        # feature pairs to keep CI practical; the regular CI all-features build
        # still covers the all-on case.
        run: cargo hack --locked check --feature-powerset --exclude-features unstable --no-dev-deps --depth 2 --partition ${{ matrix.partition }}
